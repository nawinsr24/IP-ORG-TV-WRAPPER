name: Build apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test -x live
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk TamilTV-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: TamilTV-android, path: TamilTV-android.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath TamilTV-windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: TamilTV-windows, path: TamilTV-windows.zip }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip
        run: ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/Tamil TV.app" TamilTV-macos.zip
      - uses: actions/upload-artifact@v4
        with: { name: TamilTV-macos, path: TamilTV-macos.zip }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
